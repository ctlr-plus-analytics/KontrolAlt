services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    user: root
    volumes:
      - ./backend:/app
      - ./shared:/app/shared
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  worker-discovery:
    build:
      context: .
      dockerfile: ./scraper/Dockerfile
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379/0
    working_dir: /app
    depends_on:
      - redis
    volumes:
      - ./scraper:/app
      - ./shared:/app/shared
    command: /opt/venv/bin/celery -A worker.celery_app worker --loglevel=info --queues=discovery --concurrency=2 --prefetch-multiplier=1 --hostname=celery@worker-discovery
    restart: unless-stopped

  worker-classify:
    build:
      context: .
      dockerfile: ./scraper/Dockerfile
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379/0
    working_dir: /app
    depends_on:
      - redis
    volumes:
      - ./scraper:/app
      - ./shared:/app/shared
    command: /opt/venv/bin/celery -A worker.celery_app worker --loglevel=info --queues=classify --concurrency=2 --prefetch-multiplier=1 --hostname=celery@worker-classify
    restart: unless-stopped

  worker-gate0:
    build:
      context: .
      dockerfile: ./scraper/Dockerfile
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379/0
    working_dir: /app
    depends_on:
      - redis
    volumes:
      - ./scraper:/app
      - ./shared:/app/shared
    command: /opt/venv/bin/celery -A worker.celery_app worker --loglevel=info --queues=gate0 --concurrency=2 --prefetch-multiplier=1 --hostname=celery@worker-gate0
    restart: unless-stopped

  worker-rumble:
    build:
      context: .
      dockerfile: ./scraper/Dockerfile
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379/0
      - BROWSER_HEADLESS=true
    working_dir: /app
    depends_on:
      - redis
    volumes:
      - ./scraper:/app
      - ./shared:/app/shared
    command: /opt/venv/bin/celery -A worker.celery_app worker --loglevel=info --queues=rumble --concurrency=4 --prefetch-multiplier=1 --hostname=celery@worker-rumble
    restart: unless-stopped

  worker-substack:
    build:
      context: .
      dockerfile: ./scraper/Dockerfile
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379/0
      - BROWSER_HEADLESS=true
    working_dir: /app
    depends_on:
      - redis
    volumes:
      - ./scraper:/app
      - ./shared:/app/shared
    command: /opt/venv/bin/celery -A worker.celery_app worker --loglevel=info --queues=substack --concurrency=4 --prefetch-multiplier=1 --hostname=celery@worker-substack
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: ./scraper/Dockerfile
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379/0
    working_dir: /app
    depends_on:
      - redis
    volumes:
      - ./scraper:/app
      - ./shared:/app/shared
    command: /opt/venv/bin/celery -A worker.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    restart: unless-stopped

volumes:
  redis_data:
